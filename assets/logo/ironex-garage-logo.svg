<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- IRONEX Wordmark - Light Version (for dark backgrounds) -->
  <defs>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#A68B4B"/>
    </linearGradient>
  </defs>
  <!-- Hexagonal Icon -->
  <g transform="translate(0, 8)">
    <path d="M32 4L56 18V46L32 60L8 46V18L32 4Z" stroke="url(#goldAccent)" stroke-width="2.5" fill="none"/>
    <path d="M32 14L48 23V41L32 50L16 41V23L32 14Z" stroke="url(#goldAccent)" stroke-width="1.2" fill="none" opacity="0.5"/>
    <!-- Wrench/Precision Cross -->
    <line x1="24" y1="24" x2="40" y2="40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="24" x2="24" y2="40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="4" stroke="#C9A96E" stroke-width="1.5" fill="none"/>
  </g>
  <!-- IRONEX Text -->
  <text x="72" y="42" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="36" letter-spacing="6" fill="#FFFFFF">IRONEX</text>
  <!-- Garage Text -->
  <text x="74" y="62" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="14" letter-spacing="8" fill="#8A8A95">GARAGE</text>
  <!-- Accent Line -->
  <rect x="72" y="47" width="60" height="1.5" fill="url(#goldAccent)" rx="0.75"/>
</svg>
